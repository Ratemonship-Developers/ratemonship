<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name = "viewport" content = "width=device-width, initial-scale = 1.0">
    <title>Ratemonship | Map </title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"">
</head> 
<body>
<header class = "topbar">
</header>
<main>
   <div class="heading">
     <h1>Fleet Map</h1>
     <p>View real-time locations and status of all ships.</p>
   </div>
     
  <section class="map-layout">

    <!-- Ship List Table -->
    <div class="ship-table-container">

        <table class="list-table">

            <tr>
                <th>Ship Name/ID</th>
                <th>Location</th>
                <th>Status</th>
                <th>Speed</th>
            </tr>

            <tr>
                <td>
                    <button class="ship-list-item" data-ship="0">
                        <b>Ocean Star</b>
                        <small>RM-001</small>
                    </button>
                </td>
                <td>Atlantic Ocean</td>
                <td><span class="status healthy">Healthy</span></td>
                <td>26 km/h</td>
            </tr>

            <tr>
                <td>
                    <button class="ship-list-item" data-ship="1">
                        <b>Blue Horizon</b>
                        <small>RM-002</small>
                    </button>
                </td>
                <td>Pacific Ocean</td>
                <td><span class="status warning">Warning</span></td>
                <td>19 km/h</td>
            </tr>

            <tr>
                <td>
                    <button class="ship-list-item" data-ship="2">
                        <b>Sea Explorer</b>
                        <small>RM-003</small>
                    </button>
                </td>
                <td>Indian Ocean</td>
                <td><span class="status critical">Critical</span></td>
                <td>14 km/h</td>
            </tr>

            <tr>
                <td>
                    <button class="ship-list-item" data-ship="3">
                        <b>Marine Voyager</b>
                        <small>RM-004</small>
                    </button>
                </td>
                <td>Atlantic Ocean</td>
                <td><span class="status healthy">Healthy</span></td>
                <td>23 km/h</td>
            </tr>

            <tr>
                <td>
                    <button class="ship-list-item" data-ship="4">
                        <b>Wave Rider</b>
                        <small>RM-006</small>
                    </button>
                </td>
                <td>South Pacific</td>
                <td><span class="status healthy">Healthy</span></td>
                <td>24 km/h</td>
            </tr>

        </table>

    </div>

    <!-- Interactive Map -->
    <div id="fleetMap"></div>

    </section>
</main>
    
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="map.js"></script>
    
</body>
</html>
