<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name = "viewport" content = "width=device-width, initial-scale = 1.0">
    <title>Ratemonship | Dashboard </title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<header class = "topbar">
</header>
<main class="medium">
    <section class="stats-grid">

    <!-- Total Ships -->
    <div class="stat-box total-ships">
        <div class="stat-content">
            <i class="fa-solid fa-ship"></i>
            <div>
                <h3>Total Ships</h3>
                <strong>5</strong>
            </div>
        </div>
    </div>

    <!-- Healthy -->
    <div class="stat-box healthy">
        <div class="stat-content">
            <i class="fa-solid fa-circle-check"></i>
            <div>
                <h3>Healthy</h3>
                <strong>3</strong>
                <p>60%</p>
            </div>
        </div>
    </div>

    <!-- Needs Attention -->
    <div class="stat-box attention">
        <div class="stat-content">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <div>
                <h3>Needs Attention</h3>
                <strong>1</strong>
                <p>20%</p>
            </div>
        </div>
    </div>

    <!-- Critical -->
    <div class="stat-box critical">
        <div class="stat-content">
            <i class="fa-solid fa-circle-exclamation"></i>
            <div>
                <h3>Critical</h3>
                <strong>1</strong>
                <p>60%</p>
            </div>
        </div>
    </div>
    
    </section>
    
    <! -- Fleet Health Overview -->
    <section class="fleet-overview">
    <h2>Fleet Health Overview</h2>

    <div class="health-container">
        <div class="chart">
            <div class="donut-chart">
                <div class="chart-center">
                    <strong>5</strong>
                    <p>Total Ships</p>
                </div>
            </div>
        </div>

        <div class="health-legend">
            <div class="legend-item">
                <span class="legend-color healthy-color"></span>
                <span>Healthy</span>
                <strong>3</strong>
            </div>

            <div class="legend-item">
                <span class="legend-color attention-color"></span>
                <span>Needs Attention</span>
                <strong>1 (20%)</strong>
            </div>

            <div class="legend-item">
                <span class="legend-color critical-color"></span>
                <span>Critical</span>
                <strong>1 (20%)</strong>
            </div>
        </div>
    </div>
    </section>
    
</main>
</body>
</html>
