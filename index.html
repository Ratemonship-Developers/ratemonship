<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name = "viewport" content = "width=device-width, initial-scale = 1.0">
    <title>Ratemonship | Dashboard </title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>
<header class = "topbar">
</header>
<main class="medium">
    <section class = "stats-grid">
        <div class="stat-box total-ships">
            <h3>Total Ships</h3>
            <strong>5</strong>
        </div>
        <div class="stat-box healthy">
            <i class="fa fa-ship" aria-hidden="true"></i>
            <h3>Healthy</h3>
            <strong>3</strong>
            <p>60%</p>
        </div>
        <div class = "stat-box attention"> 
            <h3>Needs Attention</h3>
            <strong>1</strong>
            <p>20%</p>
        </div>
        <div class = "stat-box critical">
            <h3>Critical</h3>
            <strong>1</strong>
            <p>20%</p>
        </div>
    </section>
</main>
</body>
</html>
