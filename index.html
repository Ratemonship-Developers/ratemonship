<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name = "viewport" content = "width=device-width, initial-scale = 1.0">
    <title>Ratemonship | Dashboard </title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class = "topbar">
</header>
<main class="medium">
    <section>
        <div class="my-box">
            <h3>Total Ships</h3>
            <strong class="blue-text">5</strong>
        </div>
        <div class="my-box">
            <h3>Healthy</h3>
            <strong class="green-text">3</strong>
            <p>60%</p>
        </div>
        <div class="my-box"> 
            <h3>Needs Attention</h3>
            <strong class="amber-text">3</strong>
            <p>20%</p>
        </div>
        <div class="my-box">
            <h3>Critical</h3>
            <strong class="red-text">1</strong>
            <p>20%</p>
        </div>
    </section>
</main>
</body>
</html>
